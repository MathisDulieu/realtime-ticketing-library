name: Deploy — Nexus (Manual)

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release tag to deploy'
        required: true
        type: string
      confirm:
        description: 'Confirm deployment (type "deploy")'
        required: true
        type: string

jobs:
  pre-deploy-check:
    name: Pre-deployment checks
    runs-on: ubuntu-latest

    steps:
      - name: Verify confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy" ]; then
            echo "❌ Deployment cancelled: please type 'deploy' to confirm."
            exit 1
          fi
          echo "✅ Confirmation received."

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release }}
          fetch-depth: 0

      - name: Verify tag exists
        run: |
          if ! git tag | grep -q "^${{ github.event.inputs.release }}$"; then
            echo "❌ Tag ${{ github.event.inputs.release }} does not exist."
            exit 1
          fi
          echo "✅ Tag ${{ github.event.inputs.release }} found."

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests before deployment
        run: mvn verify --no-transfer-progress

  deploy:
    name: Deploy to Nexus
    runs-on: ubuntu-latest
    needs: pre-deploy-check
    environment: production

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << EOF
          <settings>
            <servers>
              <server>
                <id>nexus-releases</id>
                <username>${{ secrets.NEXUS_USERNAME }}</username>
                <password>${{ secrets.NEXUS_PASSWORD }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Deploy to Nexus
        run: mvn deploy --no-transfer-progress -DskipTests
        env:
          NEXUS_URL: ${{ secrets.NEXUS_URL }}

      - name: Deployment summary
        run: |
          echo "## Nexus Deployment" >> $GITHUB_STEP_SUMMARY
          echo "- Release: ${{ github.event.inputs.release }}" >> $GITHUB_STEP_SUMMARY
          echo "- Deployed by: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY