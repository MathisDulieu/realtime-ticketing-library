name: Build, Test & Artifact Validation

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

jobs:
  build-test-and-validate:
    name: Build, Tests, Coverage & Artifact Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile project
        run: mvn compile --no-transfer-progress

      - name: Run tests and generate JaCoCo report
        run: mvn verify --no-transfer-progress

      - name: Verify JAR presence
        run: |
          JARS=$(find . -path "*/target/*.jar" -not -name "*sources*")
          if [ -z "$JARS" ]; then
            echo "❌ No JAR found after build"
            exit 1
          fi
          echo "✅ JARs found:"
          echo "$JARS"

      - name: Upload JaCoCo reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report-${{ github.ref_name }}-${{ github.sha }}
          path: '**/target/site/jacoco/'
          retention-days: 14

      - name: Workflow summary
        if: always()
        run: |
          echo "## Build Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build: executed" >> $GITHUB_STEP_SUMMARY
          echo "- Tests: executed" >> $GITHUB_STEP_SUMMARY
          echo "- JaCoCo: reports uploaded" >> $GITHUB_STEP_SUMMARY
          echo "- JARs: verified" >> $GITHUB_STEP_SUMMARY
