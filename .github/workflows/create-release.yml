name: Create Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. 1.0.0) — created automatically if it does not exist'
        required: true
        type: string
      title:
        description: 'Release title'
        required: true
        type: string
      branch:
        description: 'Branch to create the release from'
        required: true
        default: 'main'
        type: string

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0

      - name: Create tag if it does not exist
        run: |
          if git tag | grep -q "^${{ github.event.inputs.tag }}$"; then
            echo "✅ Tag ${{ github.event.inputs.tag }} already exists."
          else
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git tag ${{ github.event.inputs.tag }}
            git push origin ${{ github.event.inputs.tag }}
            echo "✅ Tag ${{ github.event.inputs.tag }} created."
          fi

      - name: Create GitHub Release with auto-generated notes
        uses: actions/github-script@v7
        with:
          script: |
            const { data: release } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: '${{ github.event.inputs.tag }}',
              name: '${{ github.event.inputs.title }}',
              generate_release_notes: true,
              draft: false,
              prerelease: false,
              target_commitish: '${{ github.event.inputs.branch }}'
            });
            console.log(`✅ Release created: ${release.html_url}`);

      - name: Release summary
        run: |
          echo "## Release Created" >> $GITHUB_STEP_SUMMARY
          echo "- Tag: ${{ github.event.inputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- Title: ${{ github.event.inputs.title }}" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ github.event.inputs.branch }}" >> $GITHUB_STEP_SUMMARY
          echo "- Created by: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY