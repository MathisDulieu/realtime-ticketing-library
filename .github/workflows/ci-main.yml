name: CI — Main Branch

on:
  push:
    branches:
      - main

jobs:
  build-and-validate:
    name: Build, Test & Final Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile project
        run: mvn compile --no-transfer-progress

      - name: Run tests and generate JaCoCo report
        run: mvn verify --no-transfer-progress

      - name: Verify JAR presence
        run: |
          JARS=$(find . -path "*/target/*.jar" -not -name "*sources*")
          if [ -z "$JARS" ]; then
            echo "❌ No JAR found after build"
            exit 1
          fi
          echo "✅ JARs found:"
          echo "$JARS"

      - name: Upload JaCoCo reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report-main-${{ github.sha }}
          path: '**/target/site/jacoco/'
          retention-days: 30

      - name: Workflow summary
        if: always()
        run: |
          echo "## Main CI - Validation" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: main" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

          if [ "${{ job.status }}" = "success" ]; then
            echo "- Tests: OK" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Tests: FAILED" >> $GITHUB_STEP_SUMMARY
          fi
