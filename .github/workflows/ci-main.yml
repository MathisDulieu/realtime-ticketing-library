name: CI — Main Branch

on:
  push:
    branches:
      - main

jobs:
  build-and-validate:
    name: Build, Test & Final Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile project
        run: mvn compile --no-transfer-progress

      - name: Run tests and generate JaCoCo report
        run: mvn verify --no-transfer-progress

      - name: Check coverage threshold (warning only)
        run: |
          COVERAGE=$(grep -oP 'missed="\K[0-9]+(?=" covered="[0-9]+" type="LINE")' target/site/jacoco/jacoco.xml | head -1 || echo "0")
          COVERED=$(grep -oP 'covered="\K[0-9]+(?=" type="LINE")' target/site/jacoco/jacoco.xml | head -1 || echo "0")
          TOTAL=$((COVERAGE + COVERED))
          if [ "$TOTAL" -gt 0 ]; then
            PCT=$((COVERED * 100 / TOTAL))
            echo "Line coverage: ${PCT}%"
            if [ "$PCT" -lt 70 ]; then
              echo "⚠️ Coverage ${PCT}% is below 70% threshold"
            else
              echo "✅ Coverage ${PCT}% meets threshold"
            fi
          fi

      - name: Verify JAR presence
        run: |
          JAR_FILE=$(find target -name "*.jar" -not -name "*sources*" | head -1)
          if [ -z "$JAR_FILE" ]; then
            echo "❌ No JAR found after build"
            exit 1
          fi
          echo "✅ JAR found: $JAR_FILE"

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report-main-${{ github.sha }}
          path: target/site/jacoco/
          retention-days: 30

      - name: Workflow summary
        if: always()
        run: |
          echo "## Main CI — Validation OK" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: main" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Tests: OK" >> $GITHUB_STEP_SUMMARY