name: CI — Main Branch

on:
  push:
    branches:
      - main

jobs:
  build-and-validate:
    name: Build, Test & Final Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile project
        run: mvn compile --no-transfer-progress

      - name: Run tests and generate JaCoCo report
        run: mvn verify --no-transfer-progress

      - name: Check coverage threshold (warning only)
        run: |
          REPORTS=$(find . -name "jacoco.xml" -path "*/site/jacoco/*")
          if [ -z "$REPORTS" ]; then
            echo "⚠️ No JaCoCo reports found"
          else
            for jacoco_xml in $REPORTS; do
              MODULE=$(echo $jacoco_xml | cut -d'/' -f2)
              MISSED=$(awk -F'"' '/<counter type="LINE"/{missed=$2} END{print missed+0}' $jacoco_xml)
              COVERED=$(awk -F'"' '/<counter type="LINE"/{covered=$4} END{print covered+0}' $jacoco_xml)
              TOTAL=$((MISSED + COVERED))
              if [ "$TOTAL" -gt 0 ]; then
                PCT=$((COVERED * 100 / TOTAL))
                echo "[$MODULE] Line coverage: ${PCT}%"
                if [ "$PCT" -lt 70 ]; then
                  echo "⚠️ [$MODULE] Coverage ${PCT}% is below 70% threshold"
                else
                  echo "✅ [$MODULE] Coverage ${PCT}% meets threshold"
                fi
              else
                echo "⚠️ [$MODULE] No coverage data found"
              fi
            done
          fi

      - name: Verify JAR presence
        run: |
          JARS=$(find . -path "*/target/*.jar" -not -name "*sources*")
          if [ -z "$JARS" ]; then
            echo "❌ No JAR found after build"
            exit 1
          fi
          echo "✅ JARs found:"
          echo "$JARS"

      - name: Upload JaCoCo reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report-main-${{ github.sha }}
          path: '**/target/site/jacoco/'
          retention-days: 30

      - name: Workflow summary
        if: always()
        run: |
          echo "## Main CI - Validation OK" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: main" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Tests: OK" >> $GITHUB_STEP_SUMMARY
